name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  verify:
    name: Analyze and test
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Check tag matches pubspec
        run: |
          version=$(grep -E '^version:' b_player/pubspec.yaml | head -1 | sed 's/^version:[[:space:]]*//' | tr -d '\r')
          name=${version%%+*}
          if [ "v$name" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match pubspec version $version"
            exit 1
          fi

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true

      - name: Analyze
        working-directory: b_player
        run: |
          flutter pub get
          flutter analyze

      - name: Test
        working-directory: b_player
        run: flutter test

  windows:
    name: Windows
    needs: verify
    runs-on: windows-latest
    env:
      ENODE_CEF_ARCHIVE_NAME: enode_cef_149.0.7827.156_chrome_win64.tar.bz2
      ENODE_CEF_ARCHIVE_SHA256: e25a19a756aab54e0ab13ce0bbb9c342246d883fdbf39e82cca04f5f225a4f18
      ENODE_CEF_EXPECT_LIBCEF_SHA256: b5fc4d96141bb5b33370e285b2795131914ec3d9fcfac1cb2836609188b6ae7a
      ENODE_CEF_DIR: ${{ github.workspace }}/.cef-cache
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Fetch codec-enabled CEF
        shell: bash
        env:
          CEF_URL_OVERRIDE: ${{ secrets.ENODE_CEF_URL }}
          CEF_SHA256_OVERRIDE: ${{ secrets.ENODE_CEF_SHA256 }}
          CEF_TOKEN: ${{ secrets.ENODE_CEF_TOKEN }}
        run: |
          set -euo pipefail
          archive="$ENODE_CEF_DIR/$ENODE_CEF_ARCHIVE_NAME"
          mkdir -p "$ENODE_CEF_DIR"
          if [ -n "${CEF_URL_OVERRIDE:-}" ] && [ -z "${CEF_SHA256_OVERRIDE:-}" ]; then
            echo "::error::ENODE_CEF_URL is set but ENODE_CEF_SHA256 is empty"
            exit 1
          fi
          url="${CEF_URL_OVERRIDE:-https://github.com/${GITHUB_REPOSITORY}/releases/download/cef-149.0.7827.156/$ENODE_CEF_ARCHIVE_NAME}"
          sha="${CEF_SHA256_OVERRIDE:-$ENODE_CEF_ARCHIVE_SHA256}"
          if [ ! -f "$archive" ]; then
            auth=()
            if [ -n "${CEF_TOKEN:-}" ]; then auth=(-H "Authorization: Bearer $CEF_TOKEN"); fi
            if [[ "$url" == https://api.github.com/*/releases/assets/* ]]; then
              auth+=(-H "Accept: application/octet-stream")
            fi
            if ! curl -fL --retry 5 --retry-delay 5 "${auth[@]}" -o "$archive" "$url"; then
              echo "::error::failed to download the codec-enabled CEF archive. Upload it to the cef-149.0.7827.156 release, or set ENODE_CEF_URL/ENODE_CEF_SHA256 secrets."
              exit 1
            fi
          fi
          if ! echo "$sha  $archive" | sha256sum -c -; then
            echo "::error::codec-enabled CEF archive checksum mismatch"
            exit 1
          fi
          {
            echo "ENODE_CEF_TARBALL=$archive"
            echo "ENODE_CEF_SHA256=$sha"
          } >> "$GITHUB_ENV"

      - name: Build and package
        working-directory: b_player
        run: |
          flutter pub get
          powershell -NoProfile -ExecutionPolicy Bypass -File tool/package_windows.ps1 -Installer

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: b_player/dist/eNode-*-win-x64*
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  android:
    name: Android
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true

      - name: Restore signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::ANDROID_KEYSTORE_B64 and ANDROID_KEYSTORE_PASSWORD must be set; see README."
            exit 1
          fi
          mkdir -p "$HOME/keys"
          if ! printf '%s' "$KEYSTORE_B64" | tr -d ' \t\r\n' | base64 --decode > "$HOME/keys/enode-release.keystore" 2>/dev/null; then
            echo "::error::ANDROID_KEYSTORE_B64 is not valid base64. Re-copy the keystore base64 (starts with MII, no spaces)."
            exit 1
          fi
          if ! keytool -list -keystore "$HOME/keys/enode-release.keystore" -storepass "$KEYSTORE_PASSWORD" -alias enode >/dev/null 2>&1; then
            echo "::error::keystore did not open with ANDROID_KEYSTORE_PASSWORD and alias enode; check both secrets."
            exit 1
          fi
          chmod 600 "$HOME/keys/enode-release.keystore"
          cat > b_player/android/key.properties <<EOF
          storeFile=$HOME/keys/enode-release.keystore
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=enode
          keyPassword=$KEYSTORE_PASSWORD
          EOF
          chmod 600 b_player/android/key.properties

      - name: Build APK
        working-directory: b_player
        run: |
          flutter pub get
          flutter build apk --release

      - name: Verify signature
        working-directory: b_player
        run: |
          apksigner=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)
          "$apksigner" verify --print-certs build/app/outputs/flutter-apk/app-release.apk

      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: b_player/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  release:
    name: Publish
    needs: [windows, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Prepare assets
        run: |
          name="${GITHUB_REF_NAME#v}"
          mv dist/app-release.apk "dist/eNode-${name}-android.apk"
          {
            echo "# eNode ${name}"
            echo
            echo "- Windows installer: eNode-${name}-win-x64-setup.exe"
            echo "- Windows portable: eNode-${name}-win-x64.zip"
            echo "- Android: eNode-${name}-android.apk"
            echo
            echo "License: [AGPL-3.0](https://github.com/${GITHUB_REPOSITORY}/blob/main/LICENSE)"
          } > notes.md

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" \
              --verify-tag --latest --title "eNode ${GITHUB_REF_NAME#v}" --notes-file notes.md
          fi
