<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1512">
<title>绿地方案 · 点歌</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="offline" class="banner hidden">未连上点歌机，正在重试…</div>

<header class="top">
  <div class="brand">
    <span class="status-dot" id="statusDot"></span>
    <div class="brand-text">
      <h1>绿地方案</h1>
      <p id="nodeLabel">连接中…</p>
    </div>
  </div>
  <button id="seatChip" class="chip" type="button">选桌号</button>
</header>

<main>
  <section class="card">
    <div class="card-title">正在播放</div>
    <div id="nowEmpty" class="empty">待机中，点一首吧</div>
    <div id="nowBody" class="hidden">
      <div class="now-title" id="nowTitle"></div>
      <div class="now-artist" id="nowArtist"></div>
      <div class="progress"><div class="progress-fill" id="progressFill"></div></div>
      <div class="progress-meta"><span id="posText">00:00</span><span id="durText">00:00</span></div>
    </div>
  </section>

  <section class="card">
    <div class="search-row">
      <input id="q" type="search" placeholder="搜歌名 / 歌手" autocomplete="off" enterkeyhint="search">
      <button id="searchBtn" class="primary" type="button">搜索</button>
    </div>
    <div id="searchHint" class="hint"></div>
    <ul id="results" class="list"></ul>
  </section>

  <section class="card hidden" id="featuredCard">
    <div class="card-title featured-head">
      <span>本店常点</span>
      <button id="featuredMore" class="link-btn hidden" type="button">换一批</button>
    </div>
    <ul id="featuredList" class="list featured-list"></ul>
  </section>

  <section class="card">
    <div class="card-title">等待队列 <span id="queueCount" class="count"></span></div>
    <ol id="queue" class="queue"></ol>
    <div id="queueEmpty" class="empty small">队列空了</div>
  </section>
</main>

<footer class="legal">
  <span>eNode · AGPL-3.0 · © 2026 eNode contributors</span>
  <a id="sourceLink" class="hidden" target="_blank" rel="noopener">源代码</a>
</footer>

<div id="toast" class="toast hidden"></div>

<dialog id="seatDialog" class="dialog">
  <h2>你的桌号</h2>
  <p class="dialog-tip">点歌时会显示在队列里，方便找到自己的歌。</p>
  <input id="seatInput" maxlength="16" placeholder="例如 A3" autocomplete="off">
  <div class="dialog-actions">
    <button id="seatCancel" class="ghost" type="button">取消</button>
    <button id="seatOk" class="primary" type="button">确定</button>
  </div>
</dialog>

<script src="app.js"></script>
</body>
</html>
